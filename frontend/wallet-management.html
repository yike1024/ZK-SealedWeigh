<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>钱包管理 - 零知识密封加权评审系统</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // 仅本地开发：?devwallet 时用 Hardhat 已解锁账户代替 MetaMask
        (function () {
            if (new URLSearchParams(window.location.search).get('devwallet')) {
                document.write('<script src="dev-wallet.js"><\/script>');
            }
        })();
    </script>
    <script src="zk-utils.js"></script>
    <script src="recovery-key-store.js"></script>
    <script src="app-shell.js" defer></script>
</head>
<body>
    <div class="page-header">
        <h1 class="page-title">钱包管理</h1>
        <p class="page-desc">连接并管理您的 MetaMask 钱包，用于评审签名与链上确认</p>
    </div>

    <!-- 钱包连接状态 -->
    <div class="card">
        <h3>钱包状态</h3>
        <div id="walletStatus">
            <div class="loading">检查钱包状态...</div>
        </div>
    </div>

    <!-- 钱包操作 -->
    <div class="card">
        <h3>钱包操作</h3>
        <div class="action-grid">
            <div class="action-card" onclick="connectWallet()">
                <div class="action-icon">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.1.1l3-3a5 5 0 0 0-7.1-7.1l-1.2 1.2"></path><path d="M14 11a5 5 0 0 0-7.1-.1l-3 3A5 5 0 0 0 11 21l1.2-1.2"></path></svg>
                </div>
                <h3>连接钱包</h3>
                <p>连接 MetaMask 钱包到系统</p>
            </div>
            <div class="action-card" onclick="updateWalletOnServer()">
                <div class="action-icon">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11A8 8 0 0 0 6.3 6.3L4 8.5"></path><path d="M4 4v4.5h4.5"></path><path d="M4 13a8 8 0 0 0 13.7 4.7L20 15.5"></path><path d="M20 20v-4.5h-4.5"></path></svg>
                </div>
                <h3>同步到服务器</h3>
                <p>将钱包地址保存到账户</p>
            </div>
            <div class="action-card" onclick="verifyWalletOwnership()">
                <div class="action-icon">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6l7-3z"></path><path d="M9.5 12.5l1.8 1.8 3.4-3.6"></path></svg>
                </div>
                <h3>验证所有权</h3>
                <p>通过签名验证钱包所有权</p>
            </div>
        </div>
    </div>

    <!-- 钱包信息 -->
    <div class="card">
        <h3>钱包信息</h3>
        <div id="walletDetails" style="display: none;">
            <div class="info-grid">
                <div class="info-item">
                    <label>钱包地址:</label>
                    <span id="walletAddress" class="wallet-address"></span>
                </div>
                <div class="info-item">
                    <label>网络:</label>
                    <span id="walletNetwork"></span>
                </div>
                <div class="info-item">
                    <label>账户余额:</label>
                    <span id="walletBalance">获取中...</span>
                </div>
                <div class="info-item">
                    <label>服务器状态:</label>
                    <span id="serverWalletStatus">未同步</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 恢复密钥（本地加密存储） -->
    <div class="card">
        <div class="card-head"><h3>恢复密钥</h3></div>
        <div id="recoveryKeyStatus"><div class="loading">检查恢复密钥...</div></div>
    </div>

    <div class="card">
        <div class="form-actions">
            <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'">
                返回仪表板
            </button>
        </div>
    </div>

    <script>
        // 页面加载时检查钱包状态
        window.addEventListener('load', async function() {
            await checkWalletStatus();
            await refreshRecoveryKey();
        });

        /* ---------------- 恢复密钥状态（P3.8 / P3.9） ---------------- */

        async function currentAccountAddress() {
            try {
                const result = await ZKUtils.getCurrentUser();
                return (result && result.data && result.data.wallet_address) || '';
            } catch (error) {
                return '';
            }
        }

        function formatTime(value) {
            if (!value) return '—';
            const date = new Date(value);
            return isNaN(date.getTime()) ? '—' : date.toLocaleString('zh-CN');
        }

        async function refreshRecoveryKey() {
            const box = document.getElementById('recoveryKeyStatus');
            const address = await currentAccountAddress();

            if (!address) {
                box.innerHTML = `
                    <div class="status warning">
                        <p>当前账号未绑定钱包，无法使用恢复密钥。请先连接钱包并同步到服务器。</p>
                    </div>`;
                return;
            }

            try {
                const info = await RecoveryKeyStore.getKeyInfo(address);
                if (!info.exists) {
                    box.innerHTML = `
                        <div class="status info">
                            <p>本浏览器尚未保存恢复私钥。未生成私钥时，无法在数据丢失后解开托管的份额。</p>
                            <a class="btn btn-small btn-secondary" style="margin-top: 8px;"
                               href="recovery.html">去恢复中心生成</a>
                        </div>`;
                    return;
                }

                const backendLabel = info.backend === 'indexeddb' ? 'IndexedDB' : 'localStorage';
                box.innerHTML = `
                    <div class="status success">
                        <p>恢复私钥已用钱包派生密钥加密保存在本浏览器。</p>
                    </div>
                    <div class="kv" style="margin-top: 12px;">
                        <span class="kv-k">钱包地址</span>
                        <span class="kv-v">${address}</span>
                        <span class="kv-k">存储位置</span>
                        <span class="kv-v">${backendLabel} · 记录 v${info.version}</span>
                        <span class="kv-k">密钥 epoch</span>
                        <span class="kv-v">${info.epoch}</span>
                        <span class="kv-k">创建时间</span>
                        <span class="kv-v">${formatTime(info.createdAt)}</span>
                        <span class="kv-k">最近更新</span>
                        <span class="kv-v">${formatTime(info.updatedAt)}</span>
                    </div>
                    ${info.pendingMigration ? '<p class="field-hint">检测到 P3.4 旧记录，下次读取时会自动迁移到 v2。</p>' : ''}
                    <div class="form-actions" style="margin-top: 12px;">
                        <button class="btn btn-small btn-secondary" onclick="rotateRecoveryKey()">
                            轮换本地加密密钥
                        </button>
                        <button class="btn btn-small btn-danger" onclick="removeRecoveryKey()">
                            删除本地恢复私钥
                        </button>
                    </div>
                    <p class="field-hint" style="margin-top: 8px;">
                        轮换只更换本地加密的派生密钥（epoch+1），不改变 ECDH 私钥本身，已托管的份额仍可解开；
                        删除后本浏览器将无法解开份额，只能请其他评委重新登记。
                    </p>`;
            } catch (error) {
                box.innerHTML = `
                    <div class="status error">
                        <p>读取恢复密钥状态失败：${error.message}</p>
                    </div>`;
            }
        }

        async function rotateRecoveryKey() {
            const address = await currentAccountAddress();
            if (!address) {
                ZKUtils.showNotification('当前账号未绑定钱包', 'error');
                return;
            }
            if (!window.ethereum) {
                ZKUtils.showNotification('未检测到以太坊钱包，无法轮换', 'error');
                return;
            }
            try {
                const result = await RecoveryKeyStore.rotatePrivateKey({
                    address: address,
                    sign: (message) => RecoveryKeyStore.personalSign(message, window.ethereum, address)
                });
                ZKUtils.showNotification('本地加密密钥已轮换到 epoch ' + result.epoch, 'success');
                await refreshRecoveryKey();
            } catch (error) {
                ZKUtils.showNotification('轮换失败: ' + error.message, 'error');
            }
        }

        async function removeRecoveryKey() {
            const address = await currentAccountAddress();
            if (!address) return;
            if (!window.confirm('删除后本浏览器将无法解开已托管的份额，确定继续？')) return;
            try {
                await RecoveryKeyStore.clear(address);
                ZKUtils.showNotification('本地恢复私钥已删除', 'info');
                await refreshRecoveryKey();
            } catch (error) {
                ZKUtils.showNotification('删除失败: ' + error.message, 'error');
            }
        }

        // 检查钱包状态
        async function checkWalletStatus() {
            const statusDiv = document.getElementById('walletStatus');
            
            if (!ZKUtils.wallet.isMetaMaskInstalled()) {
                statusDiv.innerHTML = `
                    <div class="status error">
                        <h4>MetaMask 未安装</h4>
                        <p>请安装 MetaMask 钱包扩展以使用区块链功能。</p>
                        <a href="https://metamask.io/download.html" target="_blank" class="btn btn-small">
                            下载 MetaMask
                        </a>
                    </div>
                `;
                return;
            }

            const wallet = await ZKUtils.wallet.getCurrentWallet();
            if (wallet.success) {
                statusDiv.innerHTML = `
                    <div class="status success">
                        <h4>钱包已连接</h4>
                        <p>钱包地址: ${wallet.address}</p>
                        <button class="btn btn-small btn-secondary" onclick="disconnectWallet()">
                            断开连接
                        </button>
                    </div>
                `;
                await displayWalletDetails(wallet.address);
            } else {
                statusDiv.innerHTML = `
                    <div class="status warning">
                        <h4>钱包未连接</h4>
                        <p>请连接您的 MetaMask 钱包以使用完整功能。</p>
                        <button class="btn btn-small" onclick="connectWallet()">
                            连接钱包
                        </button>
                    </div>
                `;
            }
        }

        // 连接钱包
        async function connectWallet() {
            const result = await ZKUtils.wallet.connectWallet();
            if (result.success) {
                ZKUtils.showNotification('钱包连接成功！', 'success');
                await checkWalletStatus();
            } else {
                ZKUtils.showNotification('连接失败: ' + result.error, 'error');
            }
        }

        // 断开钱包
        async function disconnectWallet() {
            const result = await ZKUtils.wallet.disconnectWallet();
            if (result.success) {
                ZKUtils.showNotification('钱包已断开', 'info');
                await checkWalletStatus();
            }
        }

        // 显示钱包详情
        async function displayWalletDetails(address) {
            const detailsDiv = document.getElementById('walletDetails');
            detailsDiv.style.display = 'block';

            // 显示地址
            document.getElementById('walletAddress').textContent = address;

            // 获取网络信息
            const chainId = await window.ethereum.request({ method: 'eth_chainId' });
            document.getElementById('walletNetwork').textContent = ZKUtils.wallet.getNetworkName(chainId);

            // 获取余额
            try {
                const balance = await window.ethereum.request({
                    method: 'eth_getBalance',
                    params: [address, 'latest']
                });
                const balanceInEth = parseInt(balance) / 1e18;
                document.getElementById('walletBalance').textContent = `${balanceInEth.toFixed(4)} ETH`;
            } catch (error) {
                document.getElementById('walletBalance').textContent = '获取失败';
            }

            // 检查服务器状态
            await checkServerWalletStatus(address);
        }

        // 检查服务器钱包状态
        async function checkServerWalletStatus(address) {
            try {
                const userResult = await ZKUtils.getCurrentUser();
                if (userResult.success) {
                    const user = userResult.data;
                    if (user.wallet_address === address) {
                        document.getElementById('serverWalletStatus').textContent = '已同步';
                        document.getElementById('serverWalletStatus').className = 'text-ok';
                    } else {
                        document.getElementById('serverWalletStatus').textContent = '未同步';
                        document.getElementById('serverWalletStatus').className = 'text-danger';
                    }
                }
            } catch (error) {
                document.getElementById('serverWalletStatus').textContent = '检查失败';
            }
        }

        // 更新钱包到服务器
        async function updateWalletOnServer() {
            try {
                const wallet = await ZKUtils.wallet.getCurrentWallet();
                if (!wallet.success) {
                    ZKUtils.showNotification('请先连接钱包', 'error');
                    return;
                }

                const result = await ZKUtils.apiCall('/auth/wallet/update', {
                    method: 'PUT',
                    body: {
                        wallet_address: wallet.address
                    }
                });

                if (result.success) {
                    ZKUtils.showNotification('钱包地址已更新到服务器！', 'success');
                    await checkServerWalletStatus(wallet.address);
                } else {
                    ZKUtils.showNotification('更新失败: ' + result.message, 'error');
                }
            } catch (error) {
                ZKUtils.showNotification('更新失败: ' + error.message, 'error');
            }
        }

        // 验证钱包所有权
        async function verifyWalletOwnership() {
            try {
                const message = `ZK评分系统钱包验证: ${Date.now()}`;
                const result = await ZKUtils.wallet.signMessage(message);
                
                if (result.success) {
                    ZKUtils.showNotification('钱包所有权验证成功！', 'success');
                    
                    // 可以在这里将签名发送到服务器进行验证
                    console.log('签名结果:', result);
                } else {
                    ZKUtils.showNotification('验证失败: ' + result.error, 'error');
                }
            } catch (error) {
                ZKUtils.showNotification('验证失败: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
